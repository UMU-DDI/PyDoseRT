
[project]
name = "pydose_rt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name="Gerd Heilemann", email="gerd.heilemann@meduniwien.ac.at" },
    { name="Josef Lundman", email="josef@lundman.eu" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "torch>=2.6.0",
    "numpy>=1.26.4",
    "scipy>=1.11.1",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.11.0",
    "matplotlib>=3.10.0",
    "imageio>=2.37.0",
    "pydicom>=2.4.4",
    "rt-utils>=1.2.7",
    "SimpleITK>=2.4.1"
]
[project.optional-dependencies]
test=[
    "pytest>=6.0.0",
    "pytest-benchmark",
    "pytest-cov>=6.2.1"
]

[tool.uv]
python-version = "3.11"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["pydose_rt*"]
exclude = ["pydose_rt.egg-info*"]

[build-system]
requires = ["setuptools>=68.2.2"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

[tool.ruff]
line-length = 120